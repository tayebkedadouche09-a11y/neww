name: VYBE Vercel Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production invariants
        run: node scripts/production-invariants.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Wait for Vercel Git deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          PROD_URL: https://neww-dun-chi.vercel.app/
        shell: bash
        run: |
          set -euo pipefail
          echo "Vercel deployment is handled by the connected Vercel-Git integration."
          echo "Waiting for the Vercel status attached to ${TARGET_SHA}..."
          for attempt in $(seq 1 30); do
            state="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/status" \
              | jq -r '[.statuses[]? | select(.context == "Vercel")] | .[0].state // empty')"
            echo "attempt ${attempt}/30: Vercel=${state:-pending}"
            case "${state}" in
              success)
                echo "Vercel production deployment reported success for ${TARGET_SHA}."
                break
                ;;
              failure|error)
                echo "Vercel production deployment reported ${state}."
                exit 1
                ;;
            esac
            if [ "${attempt}" -eq 30 ]; then
              echo "Timed out waiting for the Vercel commit status."
              exit 1
            fi
            sleep 20
          done

          code="$(curl -sS -o /tmp/vybe-home.html -w '%{http_code}' -L --max-time 30 "${PROD_URL}")"
          echo "Production HTTP status: ${code}"
          test "${code}" = "200"
          grep -qi "VYBE" /tmp/vybe-home.html
          echo "Production URL is reachable after the Vercel deployment."

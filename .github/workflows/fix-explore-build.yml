name: Temporary ExploreExperience build fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix TypeScript build errors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/explore/ExploreExperience.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('sub: `≈ ${10 * USD_TO_DZD_DISPLAY.toLocaleString()} DZD`', 'sub: `≈ ${(10 * USD_TO_DZD_DISPLAY).toLocaleString()} DZD`')
          s = s.replace('const PLACE_TYPES = [', 'type PlaceType = {\n  id: string;\n  query: string;\n  label: string;\n  emoji: string;\n  flag?: string;\n};\n\nconst PLACE_TYPES: readonly PlaceType[] = [')
          s = s.replace('] as const;\n\nconst TIME_OPTIONS', '];\n\nconst TIME_OPTIONS', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-explore-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/explore/ExploreExperience.tsx .github/workflows/fix-explore-build.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: resolve ExploreExperience TypeScript build errors'
          git push
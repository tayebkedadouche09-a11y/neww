name: CERT Production Browser

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-cert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for Vercel production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          PROD_URL: https://neww-dun-chi.vercel.app/
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for Vercel check on ${TARGET_SHA}..."
          for attempt in $(seq 1 18); do
            state="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/status" \
              | jq -r '[.statuses[]? | select(.context == "Vercel")] | .[0].state // empty')"
            echo "attempt ${attempt}: Vercel=${state:-pending}"
            case "${state}" in
              success) exit 0 ;;
              failure|error) echo "Vercel deployment check failed: ${state}"; break ;;
            esac
            sleep 10
          done
          echo "Vercel commit check was not successful within the polling window. Verifying production directly..."
          code="$(curl -sS -o /tmp/vybe-home.html -w '%{http_code}' -L --max-time 30 "${PROD_URL}")"
          echo "Production HTTP status: ${code}"
          test "${code}" = "200"
          grep -qi "VYBE" /tmp/vybe-home.html

      - name: Verify Chrome availability
        run: |
          google-chrome --version || chromium --version || chromium-browser --version

      - name: Live Flow F certification
        env:
          VYBE_PRODUCTION_URL: https://neww-dun-chi.vercel.app/
          CERT_OUTPUT_DIR: cert-live-output/flow-f
        run: node scripts/cert-flow-f-live.mjs

      - name: Full live CERT 180
        env:
          VYBE_PRODUCTION_URL: https://neww-dun-chi.vercel.app/
        run: node scripts/cert-180-live.mjs

      - name: Enforce CERT 180 verdict
        shell: bash
        run: |
          set -euo pipefail
          test -f cert-live-run3.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('cert-live-run3.json', 'utf8'));
          const s = r.summary || {};
          const n = r.network || s.network || {};
          const failures = [];
          if ((r.initialExplore?.cardCount ?? 0) < 1) failures.push('Explore has no live place cards');
          if ((s.totalSearchQueries ?? 0) !== 17) failures.push(`expected 17 search queries, got ${s.totalSearchQueries ?? 0}`);
          if ((s.queriesWithResults ?? 0) < 15) failures.push(`too many empty queries: ${s.queriesWithResults ?? 0}/17`);
          if ((s.deepDiveCount ?? 0) < 4) failures.push(`insufficient deep dives: ${s.deepDiveCount ?? 0}`);
          if ((s.exactPhotoIdentityVerified ?? 0) < 1) failures.push('no exact Google photo identity was verified');
          if ((s.crossPlacePhotoViolations ?? 0) !== 0) failures.push(`cross-place photo violations: ${s.crossPlacePhotoViolations}`);
          if (!r.map?.googleMapRendered) failures.push('Google Map did not render');
          if (!r.map?.previewMatchesName) failures.push('Map preview does not match selected place');
          if ((r.mobile?.cardCount ?? 0) < 1) failures.push('mobile viewport has no place cards');
          if ((s.pageErrorCount ?? 0) !== 0) failures.push(`page errors: ${s.pageErrorCount}`);
          if ((n.http429 ?? 0) !== 0) failures.push(`Google HTTP 429 responses: ${n.http429}`);
          if ((n.quotaErrors ?? 0) !== 0) failures.push(`Google/Maps provider error responses: ${n.quotaErrors}`);
          if (failures.length) {
            console.error('CERT 180 FAIL');
            for (const f of failures) console.error(` - ${f}`);
            process.exit(1);
          }
          console.log('CERT 180 PASS — all production gates satisfied');
          NODE

      - name: Upload live CERT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vybe-cert-live-${{ github.sha }}
          path: |
            cert-live-output/**
            cert-evidence/**
            cert-live-run3.json
          if-no-files-found: ignore

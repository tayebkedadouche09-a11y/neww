name: CERT Production Browser
on:
  workflow_run:
    workflows: ["VYBE Vercel Deploy"]
    types: [completed]
permissions:
  contents: read
jobs:
  browser-cert:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Live production browser CERT
        env:
          VYBE_PRODUCTION_URL: https://neww-dun-chi.vercel.app/
        run: node scripts/cert-production-browser.mjs

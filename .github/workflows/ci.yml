name: VYBE clean verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - name: Verify clean architecture
        run: test -f src/engine.ts && test -f src/App.tsx && ! find src -mindepth 1 -maxdepth 2 -type d | grep -E 'context|services|components|features|pages'
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Production invariants
        run: node scripts/production-invariants.mjs
      - name: Real-only runtime invariants
        run: node scripts/real-only-invariants.mjs
      - name: Security invariants
        run: node scripts/security-invariants.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

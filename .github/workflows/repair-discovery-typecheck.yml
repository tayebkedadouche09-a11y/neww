name: Repair discovery typecheck

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix boolean configuration check
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/services/discoveryService.ts')
          text = path.read_text()
          old = 'isGoogleMapsConfigured()'
          new = 'isGoogleMapsConfigured'
          if old not in text:
              raise SystemExit('Expected boolean call pattern not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Verify
        run: |
          npm ci
          node scripts/production-invariants.mjs
          npm run typecheck
          npm run build
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/discoveryService.ts
          git commit -m "fix: treat Google Maps config as boolean" || exit 0
          git push origin main

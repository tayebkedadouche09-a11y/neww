name: Polish Core VYBE Flows

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch shared flows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Share action: no place fallback, so plan sharing can correctly use activePlan.
          path = Path('src/context/DataContext.tsx')
          text = path.read_text(encoding='utf-8')
          old = "setShareTargetPlace(place || selectedPlace || places[0] || null);"
          new = "setShareTargetPlace(place || selectedPlace || null);"
          if old not in text:
              raise SystemExit('DataContext share fallback pattern not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Profile editor follows the currently selected persona/account.
          path = Path('src/components/profile/ProfileView.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace("import React, { useState } from 'react';", "import React, { useEffect, useState } from 'react';", 1)
          anchor = "  const [editMoods, setEditMoods] = useState<MoodType[]>(currentUser?.favoriteMoods || ['chill']);\n\n"
          addition = anchor + "  useEffect(() => {\n    setEditName(currentUser?.name || '');\n    setEditBio(currentUser?.bio || '');\n    setEditMoods(currentUser?.favoriteMoods || ['chill']);\n  }, [currentUser?.id]);\n\n"
          if anchor not in text:
              raise SystemExit('Profile editor state anchor not found')
          text = text.replace(anchor, addition, 1)
          path.write_text(text, encoding='utf-8')

          # New Plan exposes the budget state that is already passed to createPlan().
          path = Path('src/components/plan/VybePlanBuilder.tsx')
          text = path.read_text(encoding='utf-8')
          anchor = "            <div className=\"flex justify-end gap-2\">\n"
          addition = "            <div className=\"flex items-center gap-2 max-w-xs\">\n              <label htmlFor=\"new-plan-budget\" className=\"text-xs font-bold text-slate-700 dark:text-slate-300 whitespace-nowrap\">Budget / person ($)</label>\n              <input id=\"new-plan-budget\" type=\"number\" min=\"0\" step=\"1\" value={newBudget} onChange={e => setNewBudget(Math.max(0, Number(e.target.value) || 0))} className=\"w-full p-3 rounded-xl bg-white dark:bg-vybe-dark-card border border-slate-200 dark:border-vybe-dark-border text-sm text-slate-900 dark:text-white focus:outline-none\" />\n            </div>\n\n" + anchor
          if anchor not in text:
              raise SystemExit('Plan budget anchor not found')
          text = text.replace(anchor, addition, 1)
          path.write_text(text, encoding='utf-8')

          # Collection deep links select the requested collection from ?collection=ID.
          path = Path('src/components/profile/CollectionsView.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace("import React, { useState } from 'react';", "import React, { useEffect, useState } from 'react';", 1)
          anchor = "  const [color, setColor] = useState('#CCFF00');\n\n"
          addition = anchor + "  useEffect(() => {\n    const requestedId = new URLSearchParams(window.location.search).get('collection');\n    if (requestedId && collections.some(collection => collection.id === requestedId)) {\n      setActiveCollectionId(requestedId);\n    }\n  }, [collections]);\n\n"
          if anchor not in text:
              raise SystemExit('Collection deep-link anchor not found')
          path.write_text(text.replace(anchor, addition, 1), encoding='utf-8')
          PY

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/polish-core-flows.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context/DataContext.tsx src/components/profile/ProfileView.tsx src/components/plan/VybePlanBuilder.tsx src/components/profile/CollectionsView.tsx .github/workflows/polish-core-flows.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: polish sharing plans profiles and collections [skip ci]"
          git push origin HEAD:main
